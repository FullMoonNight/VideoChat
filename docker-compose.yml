services:
  postgres:
    image: postgres:latest
    container_name: postgres
    env_file: ".env"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -p ${DB_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DB} || 1" ]
      interval: 10s
      timeout: 5s
      start_period: 5s
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: backend
    command: npm run dev
    restart: always
    env_file: ".env"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 4001:4001
    volumes:
      - ./server/src:/app/src

volumes:
  postgres_data: